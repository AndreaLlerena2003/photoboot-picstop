<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photoboot-Picstop | Live Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff3e00;
            --accent: #4facee;
            --bg: #0f172a;
            --card: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            backdrop-filter: blur(12px);
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .preview-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 3/2;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .preview-wrapper:hover {
            transform: scale(1.01);
        }

        #preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        button {
            padding: 0.8rem 2rem;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 14px 0 rgba(255, 62, 0, 0.39);
        }

        .btn-primary:hover {
            background: #e63700;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #10b981;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Live Preview</h1>
    <p>Real-time Canon EVF stream connected via Picstop Service</p>

    <div class="preview-wrapper">
        <img id="preview" src="/preview" alt="Connecting to camera...">
    </div>

    <div class="controls">
        <button class="btn-primary" onclick="capture()">Capture Photo</button>
        <button class="btn-outline" onclick="togglePreview()">Toggle Feed</button>
    </div>

    <div class="status">
        <span class="dot"></span>
        Live Connection Active
    </div>
</div>

<script>
    function capture() {
        fetch('/capture', {method: 'POST'})
            .then(r => r.json())
            .then(data => alert('Photo saved to: ' + data.path))
            .catch(e => console.error('Capture failed', e));
    }

    function togglePreview() {
        const img = document.getElementById('preview');
        if (img.src.includes('preview')) {
            img.src = '';
            img.alt = 'Feed Paused';
        } else {
            img.src = '/preview';
            img.alt = 'Connecting...';
        }
    }
</script>
</body>
</html>
